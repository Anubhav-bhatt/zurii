# Production overlay. Use together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Assumes TLS is terminated in FRONT of this stack (host nginx, Caddy, an ALB,
# or a platform router). Without HTTPS do not use this overlay — NODE_ENV
#=production marks the refresh-token cookie Secure and admin sessions break.

services:
  backend:
    environment:
      NODE_ENV: production
    # Point at a managed Postgres (Aiven/Neon/Supabase/RDS) by setting
    # DATABASE_URL in .env; it overrides the value composed from POSTGRES_*.
    # Then start without the bundled db:
    #   docker compose ... up -d --no-deps backend frontend
    restart: always

  frontend:
    # Bind to loopback only, so the host's TLS reverse proxy is the sole
    # public entrypoint and nothing reaches nginx directly over plain HTTP.
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    restart: always

  db:
    restart: always
    # Never publish the database to the internet.
    ports: !reset []
