  <title>Zurii Travels</title>
  <script>
    (function() {
      // Dark is the site default: only an explicit 'light' choice opts out.
      // Only the storage read is guarded — if localStorage throws (blocked
      // cookies, sandboxed iframe), the class decision below must still run,
      // or the first paint is white and snaps to dark after React mounts.
      var saved = null;
      try { saved = localStorage.getItem('zurii_theme'); } catch (e) {}
      if (saved === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
