# Rendered by the nginx entrypoint's envsubst pass at container start.
# Only ${BACKEND_URL} is substituted — nginx's own $uri / $host / $scheme
# survive because envsubst only replaces names present in the environment.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Needed because proxy_pass below uses a variable,
    # which defers name resolution to request time — nginx will then start
    # even when the backend container is not up yet.
    resolver 127.0.0.11 ipv6=off valid=10s;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml;

    client_max_body_size 2m;

    # ── Security headers ─────────────────────────────────────────────
    #
    # These protect the HTML document (the API sets its own headers via helmet).
    #
    # nginx gotcha that shapes everything below: `add_header` in a location
    # block DISCARDS every add_header inherited from the server block. Both
    # `location /assets/` and `location = /index.html` set Cache-Control, so
    # they would silently ship with no security headers at all — which is
    # exactly where they matter most, since /index.html is the document. The
    # headers are therefore repeated in those locations rather than only here.
    #
    # CSP notes:
    #   script-src includes 'unsafe-inline' because index.html carries the
    #     inline theme bootstrap that sets the dark class before first paint.
    #     Pinning its sha256 instead would be stronger, but the hash silently
    #     invalidates on any whitespace edit and the page would flash light —
    #     so this is a deliberate, documented trade, and CSP here is defence in
    #     depth against injected <object>/<base>/framing rather than a complete
    #     XSS control. React's escaping remains the primary defence.
    #   img-src allows https: because trip imagery is hosted on Unsplash.
    #   connect-src is 'self': this deployment proxies /api through nginx on the
    #     same origin (see the Dockerfile's VITE_API_URL note). If you point the
    #     frontend at a different backend origin, add that origin here too.
    set $zurii_csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    add_header Content-Security-Policy   $zurii_csp                        always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    # frame-ancestors above is the modern control; this covers older browsers.
    add_header X-Frame-Options           "DENY"                            always;

    # HSTS is intentionally NOT set here: this server listens on plain :80
    # behind whatever terminates TLS. Sending it over HTTP is ignored at best
    # and, once a client has seen it, pins them to HTTPS — which breaks the
    # stack if TLS is not actually in front. Enable it at the TLS terminator,
    # or uncomment once you are certain every request arrives over HTTPS:
    # add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # ── API → backend ────────────────────────────────────────────────
    # Proxying under the same origin as the SPA means no CORS preflight and
    # the SameSite=Lax refresh-token cookie is sent normally.
    location /api/ {
        set $upstream ${BACKEND_URL};
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # ── Static assets ────────────────────────────────────────────────
    # Vite emits content-hashed filenames, so these are safe to pin forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated because this block's add_header drops the server-level set.
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # ── SPA routing ──────────────────────────────────────────────────
    # react-router owns the URL space; unknown paths must return index.html
    # rather than 404 or a deep link like /explore breaks on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the shell, or clients pin a stale asset manifest.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        # The document itself — every security header must be repeated here,
        # because the Cache-Control line above drops the inherited set.
        add_header Content-Security-Policy $zurii_csp                        always;
        add_header X-Content-Type-Options  "nosniff"                         always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Frame-Options         "DENY"                            always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
