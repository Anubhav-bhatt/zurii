# Rendered by the nginx entrypoint's envsubst pass at container start.
# Only ${BACKEND_URL} is substituted — nginx's own $uri / $host / $scheme
# survive because envsubst only replaces names present in the environment.

# ── Per-response headers that depend on what is served ─────────────
# Set once at server level (see the add_header gotcha below) and left empty —
# which means "not sent" — when they do not apply.

# Every HTML document is revalidated on each visit, so a deploy is seen at once.
map $sent_http_content_type $zurii_html_cache {
    ~^text/html  "no-cache";
    default      "";
}

# Private routes are never indexed. Keyed on the ORIGINAL request, not $uri:
# a trip page served through the app-shell fallback must stay indexable.
map $request_uri $zurii_robots {
    ~^/(admin|dashboard)(/|\?|$)  "noindex, nofollow";
    ~^/spa-fallback\.html          "noindex";
    default                        "";
}

# The visitor's query string (campaign tags) appended to a redirect target
# that already has its own: "&utm_source=…", or nothing.
map $args $zurii_and_args {
    ""       "";
    default  "&$args";
}

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Redirects carry a relative Location. nginx would otherwise build an
    # absolute one from its own scheme, host and port — http://127.0.0.1/… here,
    # behind a TLS-terminating proxy a downgrade to http.
    absolute_redirect off;

    # Docker's embedded DNS. Needed because proxy_pass below uses a variable,
    # which defers name resolution to request time — nginx will then start
    # even when the backend container is not up yet.
    resolver 127.0.0.11 ipv6=off valid=10s;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml;

    client_max_body_size 2m;

    # ── Security headers ─────────────────────────────────────────────
    #
    # These protect the HTML document (the API sets its own headers via helmet).
    #
    # nginx gotcha that shapes everything below: `add_header` in a location
    # block DISCARDS every add_header inherited from the server block.
    # `location /assets/` sets its own Cache-Control, so it repeats the headers
    # it needs. Everything else — every HTML page — takes the server-level set,
    # which is why the per-response Cache-Control and X-Robots-Tag are maps
    # above rather than add_header lines inside page locations.
    #
    # CSP notes:
    #   script-src includes 'unsafe-inline' because index.html carries the
    #     inline theme bootstrap that sets the dark class before first paint.
    #     Pinning its sha256 instead would be stronger, but the hash silently
    #     invalidates on any whitespace edit and the page would flash light —
    #     so this is a deliberate, documented trade, and CSP here is defence in
    #     depth against injected <object>/<base>/framing rather than a complete
    #     XSS control. React's escaping remains the primary defence.
    #   img-src allows https: because a few catalogue records still point at
    #     remote images (Unsplash), and the Meta Pixel's fallback beacon is an
    #     image from www.facebook.com.
    #   Meta Pixel (loaded only after a visitor allows marketing cookies):
    #     script-src adds exactly https://connect.facebook.net (fbevents.js and
    #     its per-Pixel config); connect-src adds https://www.facebook.com, where
    #     events are posted, and connect.facebook.net. No wildcard origins.
    #   connect-src is otherwise 'self': this deployment proxies /api through
    #     nginx on the same origin (see the Dockerfile's VITE_API_URL note). If
    #     you point the frontend at a different backend origin, add it here too.
    set $zurii_csp "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://www.facebook.com https://connect.facebook.net; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    add_header Content-Security-Policy   $zurii_csp                        always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    # frame-ancestors above is the modern control; this covers older browsers.
    add_header X-Frame-Options           "DENY"                            always;
    add_header Cache-Control             $zurii_html_cache;
    add_header X-Robots-Tag              $zurii_robots                     always;

    # HSTS is intentionally NOT set here: this server listens on plain :80
    # behind whatever terminates TLS. Sending it over HTTP is ignored at best
    # and, once a client has seen it, pins them to HTTPS — which breaks the
    # stack if TLS is not actually in front. Enable it at the TLS terminator,
    # or uncomment once you are certain every request arrives over HTTPS:
    # add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # ── API → backend ────────────────────────────────────────────────
    # Proxying under the same origin as the SPA means no CORS preflight and
    # the SameSite=Lax refresh-token cookie is sent normally.
    location /api/ {
        set $upstream ${BACKEND_URL};
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # ── Static assets ────────────────────────────────────────────────
    # Immutable by construction: Vite's bundles carry a content hash in the
    # name, and images live under /assets/{travel,brand}/v<recipe>/<id-with-
    # content-hash>/ (tools/images refuses to change bytes at a published path).
    # A missing file is a real 404, never index.html. One Cache-Control header
    # (`expires` used to add a second one), and only on 200 — no `always` — so
    # a 404 is never cached for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Repeated because this block's add_header drops the server-level set.
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # ── Pages (ZT-17) ────────────────────────────────────────────────
    # The build prerenders every public page to <route>/index.html
    # (frontend/scripts/prerender.mjs), so a crawler or link-preview bot gets
    # that page's own title, description and canonical. The same rules as
    # vercel.json; docs/SEO.md explains them.

    # Old category URLs: permanent redirects to their /packages equivalents.
    location = /international             { return 301 /packages?tag=international$zurii_and_args; }
    location = /best-sellers              { return 301 /packages?popular=true$zurii_and_args; }
    location = /all-domestic-destinations { return 301 /packages?tag=domestic$zurii_and_args; }
    location ~ ^/explore/(international|domestic|adventure|beach|heritage)/?$ { return 301 /packages?tag=$1$zurii_and_args; }
    location = /explore/european-tours    { return 301 "/packages?tag=international&q=europe$zurii_and_args"; }
    location = /explore/budget-tours      { return 301 "/packages?maxPrice=25000&sort=price_asc$zurii_and_args"; }
    # A plain prefix, so the regex above still wins for the known tags.
    location /explore/                    { return 301 /packages$is_args$args; }

    # A trip, destination or guide: its prerendered page, or — for content
    # added to the database after this build — the app shell, which renders
    # it (or its own "not found") and sets the metadata in the browser.
    location ~ ^/(trip|destination|blog)/[^/]+/?$ {
        try_files $uri/index.html /spa-fallback.html;
    }

    # The admin is the app shell, never indexed (X-Robots-Tag via the map above).
    location ~ ^/(admin|dashboard)(/|$) {
        try_files /spa-fallback.html =404;
    }

    # Everything else is a real file or a prerendered page — otherwise a real
    # 404 status with the 404 page, never the shell with 200.
    location / {
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
