# Zurii — LOCAL PostgreSQL for development and automated tests.
#
# NEVER used in production. The production stack is docker-compose.yml /
# render.yaml at the repository root and is not touched by this file.
#
#   sh infra/local-db/bootstrap-env.sh                       # once: local-only credentials
#   docker compose -f infra/local-db/compose.yml up -d --wait
#
# One PostgreSQL 16 server, two isolated databases, each owned by its own
# least-privilege login role (see init/10-zurii-databases.sh):
#
#   zurii_dev   owner zurii_dev_app    marker zurii.environment = development
#   zurii_test  owner zurii_test_app   marker zurii.environment = test
#
# Neither role can connect to the other's database. The marker is what
# backend/db/safety.js checks before any migration, seed, reset or test write —
# a host name alone never proves a database is safe to write to.
#
# Published on 127.0.0.1 only, on a non-standard port so it cannot collide with
# a PostgreSQL already running on 5432. Credentials come from
# infra/local-db/.env (gitignored, generated by bootstrap-env.sh).
name: zurii-local-db

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zurii_local_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: "${ZURII_LOCAL_PG_SUPERUSER_PASSWORD:?run sh infra/local-db/bootstrap-env.sh first}"
      # Read once, by the init script, when the volume is first created.
      ZURII_DEV_DB_PASSWORD: "${ZURII_DEV_DB_PASSWORD:?run sh infra/local-db/bootstrap-env.sh first}"
      ZURII_TEST_DB_PASSWORD: "${ZURII_TEST_DB_PASSWORD:?run sh infra/local-db/bootstrap-env.sh first}"
    ports:
      - "127.0.0.1:${ZURII_LOCAL_PG_PORT:-55432}:5432"
    volumes:
      - zurii_local_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP on purpose: during first-time initialisation the server only
      # listens on its Unix socket, so this stays unhealthy until the init
      # script has finished and both databases exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U zurii_local_admin -d zurii_test"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    restart: unless-stopped

volumes:
  zurii_local_pgdata:
    name: zurii_local_pgdata
