name: zurii

services:
  db:
    build: ./db
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-zurii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env}
      POSTGRES_DB:       ${POSTGRES_DB:-zurii}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zurii} -d ${POSTGRES_DB:-zurii}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    # Uncomment to inspect the DB from the host with psql.
    # ports: ["5432:5432"]

  backend:
    build: ./backend
    environment:
      # Host is `db`, so the driver negotiates TLS — see db/Dockerfile.
      DATABASE_URL: postgres://${POSTGRES_USER:-zurii}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zurii}
      JWT_SECRET:         ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      # Creates admin logins on first boot. Format: user:pass,user:pass
      ADMIN_SEED: ${ADMIN_SEED-}
      PORT: 5001
      # Leave as development when serving over plain HTTP: production marks the
      # refresh-token cookie Secure, so browsers drop it and admin login breaks.
      # Set to production only once you terminate TLS in front of the stack.
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Not published to the host: the only route in is through nginx.
    expose:
      - "5001"

  frontend:
    build:
      context: ./frontend
      args:
        # Empty → same-origin /api/* calls, proxied by nginx.
        VITE_API_URL: ${VITE_API_URL-}
    environment:
      BACKEND_URL: http://backend:5001
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
